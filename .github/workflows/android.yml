name: Build Android APK

on:
  push:
    branches: [ main, master ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unpack Project
      run: |
        unzip -o project.zip -d ./ || true
        rm -f project.zip

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: |
        bun install
        bun add @capacitor/core @capacitor/cli @capacitor/android

    - name: Build web project
      run: |
        bun run build || npx vite build || true

    # ЖЁСТКО СОЗДАЕМ КОНФИГ ТАК, КАК ТРЕБУЕТ РОБОТ
    - name: Create Capacitor Config
      run: |
        cat <<EOF > capacitor.config.ts
        import { CapacitorConfig } from '@capacitor/cli';
        const config: CapacitorConfig = {
          appId: 'com.pulselink.messenger',
          appName: 'PulseLink Messenger',
          webDir: '.output/public'
        };
        export default config;
        EOF

    # УДАЛЯЕМ СТАРЫЙ МУСОР И СОЗДАЕМ АНДРОИД С НУЛЯ
    - name: Initialize Capacitor Android
      run: |
        rm -rf android || true
        npx cap add android
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug || ./gradlew assemble

    - name: Find and Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/*.apk
        if-no-files-found: error
        

name: Build Android APK

on:
  push:
    branches: [ main, master ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unpack Project
      run: |
        unzip -o project.zip -d ./ || true
        rm -f project.zip

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps || npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Build web project
      run: |
        if [ -f "package.json" ] && grep -q '"build":' package.json; then
          npm run build || npx vite build || true
        fi

    - name: Initialize Capacitor
      run: |
        npx cap init "PulseLink Messenger" "com.pulselink.messenger" --web-dir=.output/public
        npx cap add android || true
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug || ./gradlew assemble

    - name: Find and Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/*.apk
        if-no-files-found: error
        

name: Build Android APK

on:
  push:
    branches: [ main, master ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unpack Project
      run: |
        unzip -o project.zip -d ./ || true
        rm -f project.zip

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: |
        bun install
        bun add @capacitor/core @capacitor/cli @capacitor/android

    - name: Build web project
      run: |
        export NITRO_PRESET=static
        bun run build || npx vite build --ssr false || true

    # ИНИЦИАЛИЗИРУЕМ ЧЕРЕЗ СТАНДАРТНУЮ КОМАНДУ БЕЗ СЛОЖНОГО СИНТАКСИСЯ
    - name: Initialize Capacitor Android
      run: |
        rm -rf android || true
        rm -f capacitor.config.* || true
        npx cap init "PulseLink Messenger" "com.pulselink.messenger" --web-dir=.output/public
        npx cap add android
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug || ./gradlew assemble

    - name: Find and Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/*.apk
        if-no-files-found: error
        
